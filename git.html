<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCBI Web Tool</title>
  <link rel="stylesheet" href="git.css">
</head>
<body>

  <header>
    <h1>NCBI Gene Search Tool</h1>
    <p>Search biological databases using NCBI</p>
  </header>

  <main>
    <section class="search-box">
      <h2>Search Gene</h2>
      <form action="https://www.ncbi.nlm.nih.gov/gene/" method="get" target="_blank">
        <input type="text" name="term" placeholder="Enter gene name (e.g., BRCA1)" required>
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="info">
      <h2>About NCBI</h2>
      <p>
        The National Center for Biotechnology Information (NCBI) provides access to biomedical and genomic information.
        It includes databases like GenBank, PubMed, and Gene.
      </p>
    </section>
  </main>

  <footer>
    <p>© 2026 Bioinformatics Student Project</p>
  </footer>

</body>
</html>
